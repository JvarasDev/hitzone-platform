server:
  port: 8081   # Puerto del microservicio de Auth

spring:
  application:
    name: ms-auth

  # ── BASE DE DATOS (Docker Local PostgreSQL) ────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/db_hitbox_auth
    username: postgres
    password: ${DB_PASSWORD:HitzonePassword123!}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# ── EUREKA CLIENT ────────────────────────────────────────────────────────────
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: hitzone-super-secret-key-2026-must-be-at-least-32-chars
  expiration-ms: 86400000   # 24 horas
