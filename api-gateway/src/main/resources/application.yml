server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # ── ms-auth ─────────────────────────────────────────────────────────────
        # Rutas internas reales del microservicio de autenticación
        - id: ms-auth-route
          uri: lb://ms-auth
          predicates:
            - Path=/api/auth/**, /api/users/**

        # Alias /api/v1/auth/** → ms-auth (para compatibilidad con frontend)
        - id: ms-auth-v1-route
          uri: lb://ms-auth
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RewritePath=/api/v1/auth/(?<segment>.*), /api/auth/${segment}

        # ── Microservicios de negocio ──────────────────────────────────────────
        - id: ms-weapons-route
          uri: lb://ms-weapons
          predicates:
            - Path=/api/weapons/**

        - id: ms-agents-route
          uri: lb://ms-agents
          predicates:
            - Path=/api/agents/**

        - id: ms-maps-route
          uri: lb://ms-maps
          predicates:
            - Path=/api/maps/**

        - id: ms-matches-route
          uri: lb://ms-matches
          predicates:
            - Path=/api/matches/**

        - id: ms-news-route
          uri: lb://ms-news
          predicates:
            - Path=/api/v1/news/**

        - id: ms-persistence-route
          uri: lb://ms-persistence
          predicates:
            - Path=/api/v1/audit/**

        - id: ms-rank-route
          uri: lb://ms-rank
          predicates:
            - Path=/api/v1/rank/**

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    cl.hitzone.api_gateway.filter: DEBUG

# Mismo secreto que ms-auth — CRÍTICO que sean idénticos
jwt:
  secret: hitzone-super-secret-key-2026-must-be-at-least-32-chars
